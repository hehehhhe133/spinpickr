<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spin Pickr — Fast Decision Wheel & Random Picker</title>
<meta name="description" content="Can't decide? Enter your options, spin the wheel, and let fate choose. Fast, free, no signup.">
<style>
:root{
  --bg:#0e0d0b; --bg2:#151310; --card:#1a1714; --line:#2c2722; --line2:#3a332c;
  --txt:#f2ece3; --muted:#a89e90; --gold:#c9a227; --gold2:#e6c34a;
  --red:#d9534f; --blue:#5bc0de; --green:#5cb85c; --pink:#ff5a8a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#201b16 0%,transparent 60%),var(--bg);
  color:var(--txt); line-height:1.5; padding:24px 16px 72px; min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.logo{font-weight:800;font-size:22px;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--red));display:inline-block}
.logo b{color:var(--gold2)}
h1{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:12px}
h1 em{font-style:normal;color:var(--gold2)}
.sub{font-size:14.5px;color:var(--muted);margin-bottom:24px}

.card{background:linear-gradient(180deg,#1c1916,#16130f);border:1px solid var(--line2);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 20px 40px -24px #000;position:relative}

/* Wheel Container */
.wheel-container{position:relative;width:100%;max-width:340px;margin:0 auto 24px;aspect-ratio:1/1}
canvas{width:100%;height:100%;display:block;transition:transform 4s cubic-bezier(0.17,0.67,0.1,1);border-radius:50%;box-shadow:0 0 0 4px var(--line2), 0 10px 30px rgba(0,0,0,0.6)}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:var(--bg);border:4px solid var(--gold);border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:10;box-shadow:0 4px 10px rgba(0,0,0,0.5);transition:.2s}
.wheel-center:hover{transform:translate(-50%,-50%) scale(1.05);background:#25201a}
.wheel-center::after{content:"";display:block;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid var(--gold);margin-top:-4px}
.pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--txt);z-index:5;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}

/* Controls */
.controls textarea{width:100%;background:#12100d;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;outline:none;resize:vertical;min-height:100px;line-height:1.6}
.controls textarea:focus{border-color:var(--gold)}
.controls small{display:block;color:var(--muted);margin-top:8px;font-size:12px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(14,13,11,0.9);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.show{opacity:1;pointer-events:auto}
.modal-content{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:30px 20px;text-align:center;width:90%;max-width:400px;transform:translateY(20px);transition:transform .3s}
.modal.show .modal-content{transform:translateY(0)}
.modal h2{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.winner-text{font-size:32px;font-weight:900;color:var(--gold2);margin-bottom:20px;word-wrap:break-word}
.btn{display:inline-block;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1200;border:none;border-radius:8px;padding:12px 24px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#12100d;border:1px solid var(--line2);color:var(--txt)}
.btn.ghost:hover{border-color:var(--gold);filter:none}

/* Ads */
.ad{min-height:90px;margin:20px 0;display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#100e0b;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}

footer{text-align:center;font-size:12px;color:#6b6358;margin-top:36px;border-top:1px solid var(--line);padding-top:18px}
footer a{color:var(--muted);text-decoration:none;margin:0 6px}
footer a:hover{color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><i></i>Spin<b>Pickr</b></div>
</header>

<h1>Let the wheel <em>decide.</em></h1>
<p class="sub">Type your options, spin the wheel, and remove the guesswork. Fast, free, and no signup required.</p>

<div class="ad"><!-- PASTE ADSTERRA TOP BANNER CODE HERE --></div>

<section class="card">
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800"></canvas>
    <div class="wheel-center" id="spinBtn"></div>
  </div>

  <div class="controls">
    <textarea id="optionsInput" placeholder="Enter options separated by newlines...&#10;Pizza&#10;Burger&#10;Sushi&#10;Tacos"></textarea>
    <small>One option per line. Min 2, max 15 options.</small>
  </div>
</section>

<div class="ad"><!-- PASTE ADSTERRA MID 300x250 CODE HERE --></div>

<footer>
  © <span id="year"></span> SpinPickr ·
  <a href="/privacy.html">Privacy</a> ·
  <a href="/about.html">About</a> ·
  <a href="/contact.html">Contact</a>
</footer>

</div>

<!-- Winner Modal -->
<div class="modal" id="resultModal">
  <div class="modal-content">
    <h2>The wheel has spoken:</h2>
    <div class="winner-text" id="winnerText">Pizza</div>
    <button class="btn" onclick="closeModal()">Spin Again</button>
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const modal = document.getElementById('resultModal');
const winnerText = document.getElementById('winnerText');
const input = document.getElementById('optionsInput');

let options = ['Yes', 'No', 'Maybe'];
input.value = options.join('\n');

const colors = ['#ff5a8a', '#5bc0de', '#5cb85c', '#f0ad4e', '#c9a227', '#9b59b6', '#e74c3c', '#1abc9c'];
let currentAngle = 0;
let isSpinning = false;

function drawWheel() {
  const numOptions = options.length;
  const arcSize = (2 * Math.PI) / numOptions;
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = canvas.width / 2;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < numOptions; i++) {
    const startAngle = i * arcSize;
    const endAngle = startAngle + arcSize;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(startAngle + (arcSize / 2));
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px system-ui, sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    
    let text = options[i];
    if(text.length > 15) text = text.substring(0, 12) + '...';
    
    ctx.fillText(text, radius - 40, 10);
    ctx.restore();
  }
}

input.addEventListener('input', () => {
  let val = input.value.trim();
  if(!val) return;
  let arr = val.split('\n').map(s => s.trim()).filter(s => s !== '');
  
  if(arr.length < 2) {
    arr = arr.length === 1 ? [arr[0], 'Other'] : ['Yes', 'No'];
  } else if(arr.length > 15) {
    arr = arr.slice(0, 15);
  }
  options = arr;
  drawWheel();
});

spinBtn.addEventListener('click', () => {
  if (isSpinning || options.length < 2) return;
  isSpinning = true;
  
  const randomSpin = Math.floor(Math.random() * 3) + 5; 
  const targetAngle = currentAngle + (randomSpin * 360) + Math.floor(Math.random() * 360);
  
  canvas.style.transform = `rotate(${targetAngle}deg)`;
  currentAngle = targetAngle;

  setTimeout(() => {
    isSpinning = false;
    const normalizedAngle = targetAngle % 360;
    const arcSizeDegrees = 360 / options.length;
    let pointerAngle = (360 - normalizedAngle + 270) % 360;
    let winningIndex = Math.floor(pointerAngle / arcSizeDegrees);
    
    if(winningIndex >= options.length) winningIndex = 0;
    
    showWinner(options[winningIndex]);
  }, 4000);
});

function showWinner(winner) {
  winnerText.textContent = winner;
  modal.classList.add('show');
}

function closeModal() {
  modal.classList.remove('show');
}

drawWheel();
</script>
</body>
</html>
